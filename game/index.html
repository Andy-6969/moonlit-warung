<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit Warung: a night-market cooking game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1022; }
  #warung { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: pointer; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="warung" width="1280" height="800" aria-label="Moonlit Warung: run a night-market kitchen - 7 nights, 12 recipes, 9 regulars, 12 stall upgrades"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
